<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品原価計算</title>
<style>
  :root {
    --bg: #fdf8f2;
    --card: #ffffff;
    --accent: #b8763e;
    --accent-dark: #8f5a2c;
    --text: #3a2e26;
    --text-sub: #8a7a6d;
    --border: #e8ddd0;
    --danger: #c0503e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  h1 {
    font-size: 1.4rem;
    text-align: center;
    margin: 8px 0 20px;
    color: var(--accent-dark);
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  /* ログイン画面 */
  #login-screen {
    max-width: 360px;
    margin: 80px auto;
    text-align: center;
  }
  #login-screen p {
    color: var(--text-sub);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .google-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text);
  }
  .google-btn:hover { background: #f5efe7; }
  #auth-error {
    color: var(--danger);
    font-size: 0.85rem;
    margin-top: 16px;
    display: none;
  }
  /* ヘッダーのユーザー情報 */
  #user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 720px;
    margin: 0 auto 8px;
    font-size: 0.8rem;
    color: var(--text-sub);
  }
  #user-bar button {
    background: transparent;
    color: var(--text-sub);
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-size: 0.78rem;
  }
  #app-main { display: none; }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text-sub);
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 12px;
    color: var(--accent-dark);
  }
  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .form-row input, .form-row select {
    flex: 1;
    min-width: 70px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
  }
  button {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:hover { background: var(--accent-dark); }
  button.secondary {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  button.secondary:hover { background: var(--danger); color: #fff; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  th, td {
    text-align: left;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--text-sub); font-weight: 600; }
  .empty {
    color: var(--text-sub);
    font-size: 0.85rem;
    padding: 12px 0;
    text-align: center;
  }
  .recipe-item-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }
  .recipe-item-row select { flex: 2; }
  .recipe-item-row input { flex: 1; }
  .result-box {
    background: #fbf1e6;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
  }
  .result-box .total {
    font-size: 1.3rem;
    font-weight: bold;
    color: var(--accent-dark);
  }
  .result-box .per-unit {
    font-size: 0.95rem;
    color: var(--text-sub);
    margin-top: 4px;
  }
  .recipe-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .recipe-card:last-child { border-bottom: none; }
  .recipe-card .name { font-weight: 600; }
  .recipe-card .cost { color: var(--accent-dark); font-weight: bold; }
  .recipe-card .actions { display: flex; gap: 6px; }
  .icon-btn {
    background: transparent;
    color: var(--text-sub);
    border: 1px solid var(--border);
    padding: 4px 8px;
    font-size: 0.8rem;
  }
  .hint { font-size: 0.78rem; color: var(--text-sub); margin-top: -4px; margin-bottom: 8px; }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <h1>🍞 食品原価計算</h1>
  <p>家族で共有するには、許可されたGoogleアカウントでログインしてください。</p>
  <button class="google-btn" onclick="loginWithGoogle()">Googleでログイン</button>
  <div id="auth-error">このアカウントには利用権限がありません。</div>
</div>

<!-- アプリ本体 -->
<div id="app-main">
  <div id="user-bar">
    <span id="user-email"></span>
    <button onclick="logout()">ログアウト</button>
  </div>

  <div class="container">
    <h1>🍞 食品原価計算</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="materials">材料管理</button>
      <button class="tab-btn" data-tab="recipes">原価計算</button>
      <button class="tab-btn" data-tab="list">レシピ一覧</button>
    </div>

    <!-- 材料管理 -->
    <div class="panel active" id="panel-materials">
      <div class="card">
        <h2>材料を登録</h2>
        <div class="hint">例:強力粉 300円で1000g購入 → 1gあたり0.3円で自動計算されます</div>
        <div class="form-row">
          <input type="text" id="mat-name" placeholder="材料名(例:強力粉)">
        </div>
        <div class="form-row">
          <input type="number" id="mat-price" placeholder="購入価格(円)" min="0" step="1">
          <input type="number" id="mat-amount" placeholder="購入量" min="0" step="0.01">
          <select id="mat-unit">
            <option value="g">g</option>
            <option value="ml">ml</option>
            <option value="個">個</option>
          </select>
        </div>
        <button onclick="addMaterial()">材料を追加</button>
      </div>

      <div class="card">
        <h2>登録済み材料</h2>
        <table id="material-table">
          <thead><tr><th>材料名</th><th>単価</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="empty" id="material-empty">まだ材料が登録されていません</div>
      </div>
    </div>

    <!-- 原価計算 -->
    <div class="panel" id="panel-recipes">
      <div class="card">
        <h2>レシピを作成</h2>
        <div class="form-row">
          <input type="text" id="recipe-name" placeholder="品名(例:食パン)">
          <input type="number" id="recipe-servings" placeholder="出来上がり個数" min="1" step="1" value="1">
        </div>

        <div id="recipe-items"></div>
        <button onclick="addRecipeItemRow()" class="icon-btn" style="margin-bottom:12px;">+ 材料を追加</button>

        <div>
          <button onclick="saveRecipe()">レシピを保存</button>
        </div>

        <div class="result-box" id="recipe-result" style="display:none;">
          <div class="total" id="recipe-total"></div>
          <div class="per-unit" id="recipe-per-unit"></div>
        </div>
      </div>
    </div>

    <!-- レシピ一覧 -->
    <div class="panel" id="panel-list">
      <div class="card">
        <h2>登録済みレシピ</h2>
        <div id="recipe-list"></div>
        <div class="empty" id="recipe-list-empty">まだレシピが登録されていません</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBWOtfyBXBokGi8wcEV85bBMmjEFMNBOWY",
  authDomain: "recipe-cost-calculator-a4ada.firebaseapp.com",
  projectId: "recipe-cost-calculator-a4ada",
  storageBucket: "recipe-cost-calculator-a4ada.firebasestorage.app",
  messagingSenderId: "284308114252",
  appId: "1:284308114252:web:6b11e60afffce4a8179de9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let materials = [];
let recipes = [];
let editingRecipeId = null;
let unsubMaterials = null;
let unsubRecipes = null;

window.loginWithGoogle = async function () {
  document.getElementById('auth-error').style.display = 'none';
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    console.error(e);
    document.getElementById('auth-error').textContent = 'ログインに失敗しました: ' + e.message;
    document.getElementById('auth-error').style.display = 'block';
  }
};

window.logout = async function () {
  await signOut(auth);
};

onAuthStateChanged(auth, (user) => {
  if (unsubMaterials) { unsubMaterials(); unsubMaterials = null; }
  if (unsubRecipes) { unsubRecipes(); unsubRecipes = null; }

  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-main').style.display = 'block';
    document.getElementById('user-email').textContent = user.email;

    unsubMaterials = onSnapshot(collection(db, 'materials'), (snap) => {
      materials = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderMaterials();
      renderRecipeItemSelects();
    }, (err) => {
      console.error(err);
      document.getElementById('auth-error').textContent = 'データ取得に失敗しました(利用権限がない可能性があります)';
      document.getElementById('auth-error').style.display = 'block';
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('app-main').style.display = 'none';
      signOut(auth);
    });

    unsubRecipes = onSnapshot(collection(db, 'recipes'), (snap) => {
      recipes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderRecipeList();
    });
  } else {
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('app-main').style.display = 'none';
    materials = [];
    recipes = [];
  }
});

// タブ切り替え
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'recipes') renderRecipeItemSelects();
    if (btn.dataset.tab === 'list') renderRecipeList();
  });
});

function unitPrice(material) {
  const amount = parseFloat(material.amount);
  if (!amount) return 0;
  return parseFloat(material.price) / amount;
}

window.addMaterial = async function () {
  const name = document.getElementById('mat-name').value.trim();
  const price = document.getElementById('mat-price').value;
  const amount = document.getElementById('mat-amount').value;
  const unit = document.getElementById('mat-unit').value;

  if (!name || !price || !amount || parseFloat(amount) <= 0) {
    alert('材料名・購入価格・購入量を正しく入力してください');
    return;
  }

  await addDoc(collection(db, 'materials'), {
    name, price: parseFloat(price), amount: parseFloat(amount), unit
  });

  document.getElementById('mat-name').value = '';
  document.getElementById('mat-price').value = '';
  document.getElementById('mat-amount').value = '';
};

window.deleteMaterial = async function (id) {
  if (!confirm('この材料を削除しますか?')) return;
  await deleteDoc(doc(db, 'materials', id));
};

function renderMaterials() {
  const tbody = document.querySelector('#material-table tbody');
  tbody.innerHTML = '';
  document.getElementById('material-empty').style.display = materials.length ? 'none' : 'block';

  materials.forEach(m => {
    const tr = document.createElement('tr');
    const up = unitPrice(m).toFixed(3);
    tr.innerHTML = `
      <td>${escapeHtml(m.name)}</td>
      <td>${up}円 / ${escapeHtml(m.unit)}</td>
      <td><button class="icon-btn" onclick="deleteMaterial('${m.id}')">削除</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// レシピ材料行
function renderRecipeItemSelects() {
  document.querySelectorAll('#recipe-items select').forEach(sel => {
    const current = sel.value;
    sel.innerHTML = materials.map(m => `<option value="${m.id}">${escapeHtml(m.name)}(${escapeHtml(m.unit)})</option>`).join('');
    if (current) sel.value = current;
  });
}

window.addRecipeItemRow = function (materialId, quantity) {
  if (materials.length === 0) {
    alert('先に「材料管理」タブで材料を登録してください');
    return;
  }
  const wrap = document.getElementById('recipe-items');
  const row = document.createElement('div');
  row.className = 'recipe-item-row';
  const options = materials.map(m => `<option value="${m.id}">${escapeHtml(m.name)}(${escapeHtml(m.unit)})</option>`).join('');
  row.innerHTML = `
    <select class="ri-material">${options}</select>
    <input type="number" class="ri-quantity" placeholder="使用量" min="0" step="0.01" value="${quantity || ''}">
    <button class="icon-btn" onclick="this.parentElement.remove()">削除</button>
  `;
  wrap.appendChild(row);
  if (materialId) row.querySelector('.ri-material').value = materialId;
};

function calcRecipeCost() {
  const rows = document.querySelectorAll('#recipe-items .recipe-item-row');
  let total = 0;
  const items = [];
  rows.forEach(row => {
    const materialId = row.querySelector('.ri-material').value;
    const quantity = parseFloat(row.querySelector('.ri-quantity').value);
    const material = materials.find(m => m.id === materialId);
    if (material && quantity > 0) {
      total += unitPrice(material) * quantity;
      items.push({ materialId, quantity });
    }
  });
  return { total, items };
}

window.saveRecipe = async function () {
  const name = document.getElementById('recipe-name').value.trim();
  const servings = parseInt(document.getElementById('recipe-servings').value) || 1;
  const { total, items } = calcRecipeCost();

  if (!name) {
    alert('品名を入力してください');
    return;
  }
  if (items.length === 0) {
    alert('材料を1つ以上追加してください');
    return;
  }

  if (editingRecipeId) {
    await updateDoc(doc(db, 'recipes', editingRecipeId), { name, servings, items });
    editingRecipeId = null;
  } else {
    await addDoc(collection(db, 'recipes'), { name, servings, items });
  }

  const perUnit = total / servings;
  document.getElementById('recipe-result').style.display = 'block';
  document.getElementById('recipe-total').textContent = `合計原価: ${total.toFixed(1)}円`;
  document.getElementById('recipe-per-unit').textContent = `1個あたり: ${perUnit.toFixed(1)}円(${servings}個分)`;

  resetRecipeForm(false);
};

function resetRecipeForm(clearResult = true) {
  document.getElementById('recipe-name').value = '';
  document.getElementById('recipe-servings').value = '1';
  document.getElementById('recipe-items').innerHTML = '';
  if (clearResult) document.getElementById('recipe-result').style.display = 'none';
}

window.editRecipe = function (id) {
  const recipe = recipes.find(r => r.id === id);
  if (!recipe) return;
  editingRecipeId = id;

  document.getElementById('recipe-name').value = recipe.name;
  document.getElementById('recipe-servings').value = recipe.servings;
  document.getElementById('recipe-items').innerHTML = '';
  recipe.items.forEach(it => window.addRecipeItemRow(it.materialId, it.quantity));

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="recipes"]').classList.add('active');
  document.getElementById('panel-recipes').classList.add('active');
};

window.deleteRecipe = async function (id) {
  if (!confirm('このレシピを削除しますか?')) return;
  await deleteDoc(doc(db, 'recipes', id));
};

function renderRecipeList() {
  const wrap = document.getElementById('recipe-list');
  wrap.innerHTML = '';
  document.getElementById('recipe-list-empty').style.display = recipes.length ? 'none' : 'block';

  recipes.forEach(r => {
    let total = 0;
    r.items.forEach(it => {
      const material = materials.find(m => m.id === it.materialId);
      if (material) total += unitPrice(material) * it.quantity;
    });
    const perUnit = total / (r.servings || 1);

    const div = document.createElement('div');
    div.className = 'recipe-card';
    div.innerHTML = `
      <div>
        <div class="name">${escapeHtml(r.name)}</div>
        <div style="font-size:0.8rem;color:var(--text-sub);">${r.servings}個分</div>
      </div>
      <div class="cost">
        合計${total.toFixed(1)}円<br>
        <span style="font-size:0.8rem;font-weight:normal;">(1個 ${perUnit.toFixed(1)}円)</span>
      </div>
      <div class="actions">
        <button class="icon-btn" onclick="editRecipe('${r.id}')">編集</button>
        <button class="icon-btn" onclick="deleteRecipe('${r.id}')">削除</button>
      </div>
    `;
    wrap.appendChild(div);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
